# O plano gratuito do Supabase pausa projetos sem uso por 7 dias.
# Esta rotina faz uma consulta leve a cada 3 dias em cada unidade para manter as bases ativas.
# Nova unidade: acrescente uma linha "url chave" em BASES.
name: Manter Supabase ativo
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve em cada base
        env:
          BASES: |
            https://khyacyndvsnmdaszxlvy.supabase.co sb_publishable_rqzxj_2YbdkS11gfL0V8xg_0p-coC9i
            https://ktbejkztkxaurcjrguvk.supabase.co sb_publishable_4PCJsSLl6doKxIXJyPfPBw_IzoZK4kT
        run: |
          falhou=0
          while read -r url chave; do
            [ -z "$url" ] && continue
            if curl -sf -X POST "$url/rest/v1/rpc/meu_papel" -H "apikey: $chave" -H "Content-Type: application/json" -d '{}' > /dev/null; then
              echo "ok: $url"; else echo "falhou: $url"; falhou=1; fi
          done <<< "$BASES"
          exit $falhou
